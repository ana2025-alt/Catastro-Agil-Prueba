<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Catastro Ágil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="fondo-login min-h-screen flex flex-col items-center justify-center text-slate-200 p-4 relative">

    <canvas id="canvasParticulas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <div class="glass-panel w-full max-w-5xl rounded-2xl shadow-2xl border border-white/10 relative z-10 overflow-hidden flex flex-col md:flex-row">
        
        <!-- COLUMNA IZQUIERDA: IMAGEN -->
        <div class="hidden md:block md:w-1/2 relative bg-slate-900 border-r border-white/10 img-planos">
            <div class="absolute inset-0 bg-slate-900/40 z-10"></div>
            <div class="absolute bottom-8 left-8 z-20">
                <p class="text-cyan-400 font-mono text-xs uppercase tracking-widest mb-1"><i class="fa-solid fa-satellite mr-2"></i>Conexión Segura</p>
                <h3 class="text-white font-black text-2xl drop-shadow-lg">Registro de <br>Propiedad Digital</h3>
            </div>
        </div>

        <!-- COLUMNA DERECHA: FORMULARIO -->
        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
            <div class="text-center mb-10">
                <h1 class="text-3xl font-black uppercase tracking-widest text-white">CATASTRO <span class="text-cyan-400">ÁGIL</span></h1>
                <p class="text-slate-400 text-xs mt-2 font-mono">Bóveda de Resguardo Territorial</p>
            </div>

            <form id="loginForm" class="space-y-6 max-w-sm mx-auto w-full">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1.5">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@dominio.com" class="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-400 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-400 mb-1.5">Clave de Acceso</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950/50 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-cyan-400 outline-none">
                </div>
                <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black uppercase py-3 rounded-lg text-sm">
                    Autenticar Acceso
                </button>
            </form>

            <div class="mt-8 text-center">
                <button onclick="toggleModal(true)" class="text-xs text-cyan-400 hover:underline">¿Cliente nuevo? Registrarse aquí</button>
            </div>
        </div>
    </div>

    <!-- Modal Registro -->
    <div id="registerModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md p-6 rounded-2xl text-white">
            <h3 class="font-bold text-cyan-400 mb-4">Nuevo Registro</h3>
            <form id="registerForm" class="space-y-3">
                <input type="text" id="regCedula" placeholder="Cédula" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm">
                <input type="text" id="regNombre" placeholder="Nombre" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm">
                <input type="email" id="regEmail" placeholder="Correo" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm">
                <button type="submit" class="w-full bg-emerald-600 font-bold py-2 rounded-lg text-sm">Guardar Cliente</button>
            </form>
        </div>
    </div>

    <script src="js/particles.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

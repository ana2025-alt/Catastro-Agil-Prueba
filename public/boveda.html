<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catastro Ágil | Bóveda Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-200 min-h-screen flex flex-col relative transition-colors">

    <canvas id="canvasParticulas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Navegación de la Bóveda -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-white/10">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-shield-halved text-cyan-400 text-2xl drop-shadow-[0_0_8px_rgba(34,211,238,0.8)]"></i>
                <h1 class="font-black text-xl tracking-widest text-white">CATASTRO <span class="text-cyan-400">ÁGIL</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <span id="userBadge" class="hidden sm:inline-block text-xs bg-slate-800/80 px-3 py-1.5 rounded-md font-mono text-cyan-300 border border-cyan-900"></span>
                <button onclick="cerrarSesion()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-4 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 transition z-50">
                    <i class="fa-solid fa-power-off"></i> <b>Cerrar Sesión</b>
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal del Ledger -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 relative z-10">
        <div class="fondo-banner rounded-2xl p-8 mb-8 border-l-4 border-l-cyan-400 border-t border-r border-b border-white/10 shadow-2xl relative overflow-hidden">
            <h2 class="text-3xl font-black uppercase tracking-tight text-white relative z-10">Bóveda Criptográfica</h2>
            <p class="text-slate-300 text-sm mt-2 max-w-2xl relative z-10">
                Red inmutable de resguardo territorial. Cada documento adjunto genera una firma SHA-256 única guardada en Supabase.
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="glass-panel p-6 rounded-2xl neon-border transition">
                    <h3 class="text-lg font-bold mb-4 pb-3 border-b border-slate-700 flex items-center text-white">
                        <i class="fa-solid fa-cloud-arrow-up text-cyan-400 mr-2"></i> Nuevo Bloque
                    </h3>
                    <form id="uploadForm" class="space-y-5">
                        <div>
                            <label class="block text-xs font-black uppercase text-slate-400 mb-1">Clasificación</label>
                            <select id="categoria" class="w-full px-3 py-2.5 text-sm rounded-lg bg-slate-800 border border-slate-600 text-white outline-none focus:border-cyan-400">
                                <option value="Título de Propiedad Raíz">Título de Propiedad Raíz</option>
                                <option value="Certificado de Vehículo">Certificado de Vehículo</option>
                                <option value="Documentación Legal">Documentación Legal</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-black uppercase text-slate-400 mb-1">Archivo de Origen</label>
                            <input type="file" id="archivo" accept=".pdf, image/*" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-cyan-900/30 file:text-cyan-300 cursor-pointer">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black uppercase py-3 rounded-lg text-sm shadow-lg transition">
                            <i class="fa-solid fa-link mr-1"></i> Estampar Sello
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass-panel p-6 rounded-2xl neon-border transition">
                    <h3 class="text-lg font-bold mb-4 pb-3 border-b border-slate-700 flex items-center justify-between text-white">
                        <span><i class="fa-solid fa-server text-cyan-400 mr-2"></i> Ledger Personal</span>
                        <span class="text-[10px] uppercase font-black text-cyan-300 bg-cyan-900/30 border border-cyan-800/50 px-3 py-1 rounded-full animate-pulse">
                            <i class="fa-solid fa-signal mr-1"></i> En Línea
                        </span>
                    </h3>
                    <div id="ledger-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                        <!-- Carga dinámica -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/particles.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
